  if (isViewOnly()) return;
  if (t.id==='impFile'){ if (t.files[0]) importJson(t.files[0]); t.value=''; return; }
  if (t.dataset && t.dataset.ls){ clearTimeout(lsTimer); commitGame(t.dataset.ls); return; }
  if (t.dataset && t.dataset.endcut!==undefined){ setEndCut(t.value); return; }
  if (t.dataset && t.dataset.set){
    let v = t.value;
    if (t.dataset.num){ v = parseFloat(String(v).replace(',','.')); if (!Number.isFinite(v)) return; }
    setPath(t.dataset.set, v); commit(); return;
  }
  if (t.dataset && t.dataset.bull){
    const v = parseInt(t.value,10);
    if (v>0) S.bull[t.dataset.bull]=v; else delete S.bull[t.dataset.bull];
    commit();
  }
});
document.addEventListener('keydown', e=>{
  if (e.key==='Enter' && !isViewOnly()){
    if (e.target.id==='newName'){ e.preventDefault(); addPlayers(); }
    else if (e.target.dataset && e.target.dataset.ls){ e.preventDefault(); clearTimeout(lsTimer); commitGame(e.target.dataset.ls); }
  }
  if (e.key==='Escape') closeModal();
});

/* ---------- Brücke zum Cloud-Modul (siehe zweites Skript) ---------- */
window.IdyllApp = {
  get state(){ return S; },
  toast,
  modal, closeModal, esc,
  setCloud(o){ Object.assign(CLOUD,o); render(); },
  setRole(r){ CLOUD.role = r; render(); },
  setStatus(s){ CLOUD.status = s; render(); },
  hasPending(){ return pushTimer!==null; },
  freshState(){ const s = defaultState(); s._rev = 0; return s; },
  // Stand aus der Cloud übernehmen (eigener Tab bleibt erhalten)
  applyRemote(o){
    const tab = S.tab;
    S = o ? Object.assign(defaultState(), o) : defaultState();
    S.tab = tab; UI.edit = {};
    render();
  }
};

/* ---------- Start ---------- */
if (typeof document!=='undefined' && document.getElementById('app') && typeof window!=='undefined' && !window.__TEST__){
  S = load();
  render();
  setInterval(()=>{ if (S.started){ const c=document.getElementById('clock'); if (c){ render(); } } }, 60000);
}
if (typeof module!=='undefined') module.exports = {CLOUD, S:()=>S, setS:s=>{S=s;}, defaultState, rrPairs, scheduleSlots, endDefs, scheduleEnd, estimate, standings, structure, loadDemo, buildCtx, startTournament, drawTeams, drawGroups, canStart, uid, getUnits};
</script>

<!-- Cloud-Anbindung: Firebase (anonyme Anmeldung + Firestore). Ohne gültige config.js läuft die App rein lokal.
     Datenmodell:  tournaments/{code}                 öffentlich lesbar: Name + Spielstand
                   tournaments/{code}/private/secret  Passwort-Hash, von niemandem lesbar (nur die Regeln prüfen ihn)
                   tournaments/{code}/editors/{uid}   Geräte, die das Passwort eingegeben haben (dürfen schreiben)  -->
<script type="module">
(async () => {
  const App = window.IdyllApp; if (!App) return;
  let cfg;
  try { cfg = await import('./config.js'); } catch (e) { return; }           // z. B. Datei per Doppelklick geöffnet → lokal
  const { firebaseConfig } = cfg;
  if (!firebaseConfig || !firebaseConfig.apiKey || String(firebaseConfig.apiKey).startsWith('DEIN')) return;

  const RECENT_KEY = 'idyll-dart-recent-v1';
  const getRecents = () => { try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch (e) { return []; } };
  const addRecent = (code, name) => {
    try {
      const r = getRecents().filter(x => x.code !== code); r.unshift({ code, name });
      localStorage.setItem(RECENT_KEY, JSON.stringify(r.slice(0, 6)));
    } catch (e) {}
  };

  let fb;
  try {
    const V = '10.12.2', B = 'https://www.gstatic.com/firebasejs/' + V + '/';
    const [A, Au, Fs] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
    fb = { ...A, ...Au, ...Fs };
  } catch (e) { console.error('Firebase konnte nicht geladen werden', e); return; }

  const app = fb.initializeApp(firebaseConfig), auth = fb.getAuth(app), db = fb.getFirestore(app);
  const clientId = Math.random().toString(36).slice(2);
  const tRef = (code) => fb.doc(db, 'tournaments', code);
  const secretRef = (code) => fb.doc(db, 'tournaments', code, 'private', 'secret');
  const edRef = (code, uid) => fb.doc(db, 'tournaments', code, 'editors', uid);

  // Passwort → Hash. Das Passwort selbst verlässt den Browser nie.
  async function hashPw(code, pw) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('idyll|' + code + '|' + pw));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function me() {
    if (auth.currentUser) return auth.currentUser;
    try { return (await fb.signInAnonymously(auth)).user; }
    catch (e) {
      App.toast(e.code === 'auth/operation-not-allowed'
        ? 'In Firebase ist die anonyme Anmeldung noch nicht aktiviert (siehe README).' : 'Anmeldung fehlgeschlagen (' + (e.code || e.message) + ')', true);
      throw e;
    }
  }
  const newCode = () => { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 6; i++) s += A[Math.floor(Math.random() * A.length)]; return s; };

  let unsubT = null, unsubE = null, curCode = '', curName = '', pushing = Promise.resolve();

  function stopListening() { if (unsubT) unsubT(); if (unsubE) unsubE(); unsubT = unsubE = null; }

  function toLanding() {
    stopListening(); curCode = '';
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    App.setCloud({ mode: 'cloud', view: 'landing', role: 'guest', code: '', name: '', recents: getRecents() });
  }

  async function openTournament(code) {
    code = String(code || '').toUpperCase();
    stopListening(); curCode = code; curName = '';
    App.setCloud({ mode: 'cloud', view: 'tournament', role: 'guest', code, name: '', status: 'connecting' });
    App.applyRemote(null);
    let user;
    try { user = await me(); } catch (e) { App.setStatus('error'); return; }
    if (location.hash !== '#t=' + code) history.replaceState(null, '', location.pathname + location.search + '#t=' + code);
    let first = true;
    unsubT = fb.onSnapshot(tRef(code), (snap) => {
      if (code !== curCode) return;
      if (!snap.exists()) {
        if (first) { App.toast('Turnier „' + code + '“ nicht gefunden.', true); toLanding(); }
        return;
      }
      first = false;
      const d = snap.data();
      curName = d.name || ''; addRecent(code, curName);
      App.setCloud({ name: curName, status: 'ok' });
      if (d.by === clientId) return;                       // eigene Änderung
      if (App.hasPending()) return;                        // eigene, noch nicht gesendete Änderung gewinnt
      try { App.applyRemote(JSON.parse(d.state)); } catch (e) { console.error(e); }
    }, (err) => { console.error(err); App.setStatus('error'); });
    unsubE = fb.onSnapshot(edRef(code, user.uid), (snap) => {
      if (code !== curCode) return;
      App.setRole(snap.exists() ? 'host' : 'guest');
    }, (err) => { console.error(err); });
  }

  async function createTournament(name, pw) {
    try {
      const user = await me();
      const code = newCode(), hash = await hashPw(code, pw), state = App.freshState();
      const batch = fb.writeBatch(db);
      batch.set(secretRef(code), { hash, creator: user.uid, createdAt: Date.now() });
      batch.set(tRef(code), { name, state: JSON.stringify(state), rev: 0, by: clientId, updatedAt: Date.now() });
      batch.set(edRef(code, user.uid), { hash });
      await batch.commit();
      addRecent(code, name);
      await openTournament(code);
      App.toast('Turnier angelegt – Code ' + code);
    } catch (e) {
      console.error(e);
      App.toast(e.code === 'permission-denied' ? 'Anlegen nicht erlaubt (Firestore-Regeln prüfen).' : 'Anlegen fehlgeschlagen (' + (e.code || e.message) + ')', true);
    }
  }

  function askPassword() {
    App.modal('Bearbeiten freischalten',
      '<p class="muted small">Passwort dieses Turniers eingeben. Danach darf dieses Gerät Ergebnisse eintragen.</p><input type="password" id="edPw" autocomplete="current-password" placeholder="Passwort">',
      [{ label: 'Abbrechen', cls: 'ghost', fn: App.closeModal },
       { label: 'Freischalten', cls: 'primary', fn: async () => {
          const pw = document.getElementById('edPw').value;
          if (!pw) return;
          try {
            const user = await me();
            await fb.setDoc(edRef(curCode, user.uid), { hash: await hashPw(curCode, pw) });
            App.closeModal(); App.toast('Freigeschaltet – du kannst jetzt bearbeiten.');
          } catch (e) {
            App.toast(e.code === 'permission-denied' ? 'Falsches Passwort.' : 'Fehler (' + (e.code || e.message) + ')', true);
          }
       } }]);
    setTimeout(() => { const i = document.getElementById('edPw'); if (i) { i.focus(); i.addEventListener('keydown', ev => { if (ev.key === 'Enter') document.querySelector('[data-mbtn="1"]').click(); }); } }, 50);
  }

  async function stopEdit() {
    try { const user = await me(); await fb.deleteDoc(edRef(curCode, user.uid)); App.toast('Bearbeiten beendet – Live-Ansicht.'); }
    catch (e) { App.toast('Fehler (' + (e.code || e.message) + ')', true); }
  }

  App.setCloud({
    mode: 'cloud', available: true, recents: getRecents(),
    open: openTournament, create: createTournament, startEdit: askPassword, stopEdit, leave: toLanding,
    push: (s) => {
      const code = curCode;
      pushing = pushing.then(async () => {
        try {
          await fb.setDoc(tRef(code), { name: curName, state: JSON.stringify(s), rev: s._rev || 0, by: clientId, updatedAt: Date.now() });
          App.setStatus('ok');
        } catch (e) { console.error(e); App.setStatus('error'); App.toast('Speichern in der Cloud fehlgeschlagen – Verbindung prüfen.', true); }
      });
      return pushing;
    }
  });

  const fromHash = () => { const m = location.hash.match(/t=([A-Za-z0-9]{4,12})/); return m ? m[1].toUpperCase() : null; };
  window.addEventListener('hashchange', () => { const c = fromHash(); if (c && c !== curCode) openTournament(c); else if (!c && curCode) toLanding(); });
  const start = fromHash();
  if (start) openTournament(start); else toLanding();
})();
</script>
</body>
